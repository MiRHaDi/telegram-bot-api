name: PHP client tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, php: '8.2'}
          - {os: ubuntu-latest, php: '8.4'}
          - {os: ubuntu-latest, php: '8.5'}
          - {os: windows-latest, php: '8.3'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-plugins --no-scripts
      - run: composer test
      - run: composer audit
